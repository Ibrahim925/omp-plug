name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the same gate as `make check`: strict web typecheck + Bun tests.
      # The server boots without the omp SDK (it's resolved lazily, only on a
      # real session op), so the smoke test's /api/health path needs nothing
      # global installed.
      - name: Check
        run: make check
